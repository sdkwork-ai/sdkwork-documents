version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: doc.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        aliases:
          - documents-admin.sdkwork.com
          - documents-open.sdkwork.com
          - documents.sdkwork.com
      - domain: documents-admin.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: adaptive
        aliases:
          - documents-open.birdcoder.com
          - documents.birdcoder.com
      - domain: documents-admin.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: adaptive
        aliases:
          - documents-open.dtupay.com
          - documents.dtupay.com
      - domain: documents-admin.noaper.com
        tls: noaper.com
        mode: web+api
        web: adaptive
        aliases:
          - documents-open.noaper.com
