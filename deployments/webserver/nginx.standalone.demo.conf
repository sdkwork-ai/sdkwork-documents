# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/documents/webserver.pid;
error_log /var/log/sdkwork/documents/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name documents-demo.sdkwork.com documents-demo.birdcoder.com documents-demo.dtupay.com documents-demo.noaper.com documents-demo.sdkwork.cn documents-demo.birdcoder.cn documents-demo.dtupay.cn documents-demo.noaper.cn documents-demo.skubc.com documents-demo.skubc.cn documents-demo.zowalk.com documents-demo.zowalk.cn documents-demo.offer86.com documents-demo.offer86.cn documents-demo.86offer.com documents-demo.86offer.cn documents-admin-demo.sdkwork.com documents-admin-demo.birdcoder.com documents-admin-demo.dtupay.com documents-admin-demo.noaper.com documents-admin-demo.sdkwork.cn documents-admin-demo.birdcoder.cn documents-admin-demo.dtupay.cn documents-admin-demo.noaper.cn documents-admin-demo.skubc.com documents-admin-demo.skubc.cn documents-admin-demo.zowalk.com documents-admin-demo.zowalk.cn documents-admin-demo.offer86.com documents-admin-demo.offer86.cn documents-admin-demo.86offer.com documents-admin-demo.86offer.cn documents-open-demo.sdkwork.com documents-open-demo.birdcoder.com documents-open-demo.dtupay.com documents-open-demo.noaper.com documents-open-demo.sdkwork.cn documents-open-demo.birdcoder.cn documents-open-demo.dtupay.cn documents-open-demo.noaper.cn documents-open-demo.skubc.com documents-open-demo.skubc.cn documents-open-demo.zowalk.com documents-open-demo.zowalk.cn documents-open-demo.offer86.com documents-open-demo.offer86.cn documents-open-demo.86offer.com documents-open-demo.86offer.cn doc-demo.sdkwork.com;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/documents/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
